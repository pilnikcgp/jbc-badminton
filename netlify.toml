# Netlify: build z repozitáře. Proměnné VITE_SUPABASE_URL a VITE_SUPABASE_ANON_KEY
# nastavte v Netlify → Site configuration → Environment variables.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Interní web: nikdy neindexovat (doplňuje <meta name="robots">).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

# Soubory s hashem v názvu se nemění – cache na rok.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
